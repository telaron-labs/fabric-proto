# ci.yml — gate workflow for telaron-labs/fabric-proto.
# All jobs are trivial (seconds), so everything stays on ubuntu-latest.

name: ci

on:
  pull_request:
    branches: [main]
    # ready_for_review omitted so the auto-promote flip doesn't re-trigger.
    types: [opened, reopened, synchronize]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.26"
  # WIF provider + CI/deploy SA identities are non-secret but recon-sensitive;
  # this repo is public, so they live in repo secrets (masked in the public run
  # logs too) rather than in-tree. Consumed at job scope where secrets resolve.

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  lint:
    name: Proto lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          setup_only: true
      - run: buf lint
      - run: buf format --diff --exit-code

  breaking:
    name: Breaking-change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          setup_only: true
      # No baseline on main yet (bootstrap PR) -> nothing to break against.
      # buf's #branch= resolves a LOCAL ref, which a PR checkout lacks (only
      # origin/<base> exists), so materialise the base as a local branch first.
      - run: |
          if git show "origin/${{ github.base_ref }}:buf.yaml" >/dev/null 2>&1; then
            git fetch --no-tags --force origin "refs/heads/${{ github.base_ref }}:refs/heads/${{ github.base_ref }}"
            buf breaking --against ".git#branch=${{ github.base_ref }}"
          else
            echo "No buf module on base branch yet — skipping."
          fi

  codegen-drift:
    name: Generated code in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          setup_only: true
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Regenerate and diff
        run: |
          rm -rf gen
          buf generate
          git diff --exit-code -- gen || {
            echo "::error::gen/go is out of sync with proto sources — run 'buf generate' and commit."
            exit 1
          }
      - name: Build generated Go
        run: go build ./...

  ci-outcome:
    name: ci-outcome
    runs-on: ubuntu-latest
    needs: [secret-scan, lint, breaking, codegen-drift]
    if: ${{ always() && !contains(github.event.pull_request.labels.*.name, 'ci-paused') }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TELARON_FABRIC_GHA_APP_ID: ${{ vars.TELARON_FABRIC_GHA_APP_ID }}
      TELARON_FABRIC_GHA_INSTALLATION_ID: ${{ vars.TELARON_FABRIC_GHA_INSTALLATION_ID }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      CI_SA_EMAIL: ${{ secrets.CI_SA_EMAIL }}
      DEPLOY_SA_EMAIL: ${{ secrets.DEPLOY_SA_EMAIL }}
    steps:
      - name: Aggregate job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq .
          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key
          ')
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed: $failed"
            exit 1
          fi
          echo "All required jobs succeeded or were intentionally skipped."

      # On green CI: promote draft -> ready, arm auto-merge.
      # Vendored locally: public repos can't resolve actions from the private
      # telaron-labs/.github repo, so the shared action is carried in-tree.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/ci-finalise
        with:
          merge-method: squash
          wif-provider: ${{ env.WIF_PROVIDER }}
          ci-sa-email: ${{ env.CI_SA_EMAIL }}
          deploy-sa-email: ${{ env.DEPLOY_SA_EMAIL }}
