syntax = "proto3";

package telaron.control.v1;

import "google/protobuf/timestamp.proto";

// ControlService is the gateway-facing control-plane API (ctrl.telaron.io).
// Transport is mTLS gRPC: Register bootstraps a device identity from a
// one-time enrolment token; Connect is the long-lived bidirectional channel
// carrying heartbeats and acks upstream, config and commands downstream.
service ControlService {
  // Register enrols a gateway: CSR in, signed device certificate out.
  // Authenticated by enrolment token, not client cert (the gateway has no
  // cert yet). All subsequent RPCs require the issued device certificate.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Connect is the persistent stream. The first gateway frame MUST be Hello;
  // the control plane replies HelloAck with the current config revision so a
  // reconnecting gateway can resume without a full re-push.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);

  // Renew re-certifies an enrolled gateway before its device certificate
  // expires. Authenticated by device-proof like Connect; no enrolment token.
  // Only the gateway's current certificate may mint, and only with a new key.
  // A retry presenting the previous certificate with the already-certified
  // key is answered with the current certificate, so a lost response heals.
  rpc Renew(RenewRequest) returns (RenewResponse);
}

message RenewRequest {
  // PKCS#10 CSR, PEM. Only the public key is trusted; the subject is taken
  // from the device-proof certificate.
  bytes csr_pem = 1;
  // Gateway software version (semver).
  string version = 2;
}

message RenewResponse {
  // Signed device certificate, PEM-encoded.
  bytes certificate_pem = 1;
  // CA bundle for validating the control-plane server certificate.
  bytes ca_bundle_pem = 2;
  google.protobuf.Timestamp certificate_expires_at = 3;
}

message RegisterRequest {
  // One-time enrolment credential minted by the platform API.
  string enrolment_token = 1;
  // PKCS#10 certificate signing request, PEM-encoded. Subject/SANs are
  // validated and overridden server-side; only the public key is trusted.
  bytes csr_pem = 2;
  string name = 3;
  string cluster_id = 4;
  // Gateway software version (semver).
  string version = 5;
  map<string, string> labels = 6;
}

message RegisterResponse {
  string gateway_id = 1;
  // Signed device certificate, PEM-encoded.
  bytes certificate_pem = 2;
  // CA bundle for validating the control-plane server certificate.
  bytes ca_bundle_pem = 3;
  google.protobuf.Timestamp certificate_expires_at = 4;
}

// ConnectRequest is every gateway -> control-plane frame on the Connect stream.
message ConnectRequest {
  string gateway_id = 1;
  oneof payload {
    Hello hello = 2;
    Heartbeat heartbeat = 3;
    ConfigAck config_ack = 4;
    CommandResult command_result = 5;
  }
}

// ConnectResponse is every control-plane -> gateway frame on the Connect stream.
message ConnectResponse {
  oneof payload {
    HelloAck hello_ack = 1;
    ConfigPush config_push = 2;
    Command command = 3;
  }
}

message Hello {
  // Highest config revision the gateway has applied; 0 means fresh state
  // and requests a full config push.
  int64 last_config_revision = 1;
  string version = 2;
  // Sent on every connect, so a rotated key or moved address is picked up on
  // the next one. Attributed to the gateway named by the device-proof
  // certificate, never by anything in this message.
  WireGuardIdentity fabric = 3;
  // Intra-cluster flow-steering mesh: a separate key namespace. Unset until
  // the appliance runs one.
  WireGuardIdentity mesh = 4;
  // Addresses the appliance can observe. The platform picks the endpoint per
  // peer relationship, since mesh peers dial private and fabric peers public.
  repeated ObservedAddress addresses = 5;
}

message WireGuardIdentity {
  // Curve25519 public key, base64 as wg(8) prints it.
  string public_key = 1;
  // UDP port the appliance's interface is bound to.
  uint32 listen_port = 2;
}

message ObservedAddress {
  string ip = 1;
  AddressScope scope = 2;
  // Where the appliance learned it, e.g. "interface:eth0" or "metadata:gce".
  string source = 3;
}

enum AddressScope {
  ADDRESS_SCOPE_UNSPECIFIED = 0;
  ADDRESS_SCOPE_PRIVATE = 1;
  // Reachable from outside the VPC. On clouds with 1:1 NAT the appliance
  // never sees this on an interface, only from the metadata server.
  ADDRESS_SCOPE_PUBLIC = 2;
}

message HelloAck {
  int64 current_config_revision = 1;
  uint32 heartbeat_interval_seconds = 2;
}

message Heartbeat {
  google.protobuf.Timestamp sent_at = 1;
  HealthStatus health = 2;
  RoutingHealth routing = 3;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

// RoutingHealth is the appliance's FRR view at heartbeat time: daemon
// liveness plus one peer entry per fabric tunnel the gateway carries.
message RoutingHealth {
  RoutingDaemonState daemon = 1;
  // One entry per fabric tunnel, including tunnels the daemons hold no
  // neighbour for — those report NOT_CONFIGURED rather than being omitted,
  // so a missing peer is a real absence and never a reporting gap.
  repeated RoutingPeer peers = 2;
}

// RoutingDaemonState is liveness of the FRR daemons as a whole, independent
// of any neighbour: peer states are only trustworthy when it is READY.
enum RoutingDaemonState {
  ROUTING_DAEMON_STATE_UNSPECIFIED = 0;
  // The daemons answered a probe.
  ROUTING_DAEMON_STATE_READY = 1;
  // Not reachable yet; expected between boot and the first config apply.
  ROUTING_DAEMON_STATE_STARTING = 2;
  // Were up and no longer answer, or the last start attempt failed.
  ROUTING_DAEMON_STATE_ERROR = 3;
}

message RoutingPeer {
  // The neighbour's gateway id, taken from the fabric tunnel — FRR knows
  // addresses and ASNs, not gateway identity.
  string peer_gateway_id = 1;
  // The neighbour's address on the tunnel.
  string peer_address = 2;
  uint32 remote_asn = 3;
  BgpPeerState bgp_state = 4;
  BfdPeerState bfd_state = 5;
  // When the peer last entered its current BGP state, or, when there is no
  // BGP session, when its BFD session last transitioned.
  google.protobuf.Timestamp since = 6;
}

enum BgpPeerState {
  BGP_PEER_STATE_UNSPECIFIED = 0;
  BGP_PEER_STATE_ESTABLISHED = 1;
  BGP_PEER_STATE_CONNECT = 2;
  BGP_PEER_STATE_ACTIVE = 3;
  BGP_PEER_STATE_IDLE = 4;
  BGP_PEER_STATE_OPENSENT = 5;
  BGP_PEER_STATE_OPENCONFIRM = 6;
  // The fabric document carries this tunnel but the daemons hold no
  // neighbour for it: a divergence between control plane and appliance,
  // not a session that is down.
  BGP_PEER_STATE_NOT_CONFIGURED = 7;
}

enum BfdPeerState {
  BFD_PEER_STATE_UNSPECIFIED = 0;
  BFD_PEER_STATE_UP = 1;
  BFD_PEER_STATE_DOWN = 2;
  BFD_PEER_STATE_INIT = 3;
  BFD_PEER_STATE_ADMIN_DOWN = 4;
  // No BFD session for this peer, or one whose status the daemons did not
  // report.
  BFD_PEER_STATE_UNKNOWN = 5;
}

// ConfigPush carries the desired fabric/policy/peer state for this gateway.
message ConfigPush {
  // Monotonic per-gateway revision; gateways apply in order and ack each.
  int64 revision = 1;
  // Canonical JSON config document; schema owned by the platform.
  bytes config = 2;
  // Hex-encoded SHA-256 of config, verified before apply.
  string checksum_sha256 = 3;
}

message ConfigAck {
  int64 revision = 1;
  AckStatus status = 2;
  // Populated when status is FAILED.
  string error = 3;
}

message Command {
  // Unique command id, echoed back in CommandResult.
  string command_id = 1;
  CommandType type = 2;
  map<string, string> params = 3;
}

message CommandResult {
  string command_id = 1;
  AckStatus status = 2;
  string detail = 3;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_APPLIED = 1;
  ACK_STATUS_FAILED = 2;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_SCALE = 1;
  COMMAND_TYPE_DRAIN = 2;
  COMMAND_TYPE_REKEY = 3;
  COMMAND_TYPE_DECOMMISSION = 4;
}
